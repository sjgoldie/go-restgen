name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run tests
        run: go test ./metadata ./datastore ./router ./service ./handler ./errors ./filestore ./metrics ./internal/... -race -coverprofile=coverage.out

      # Notes come from the merged PR titles since the previous tag, so a
      # branch's intermediate commits cannot appear as if they shipped.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
